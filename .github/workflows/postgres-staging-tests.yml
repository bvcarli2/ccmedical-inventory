name: PostgreSQL staging checks
on:
  push:
    branches: [chore/render-preparation]
  pull_request:
    paths:
      - 'postgres_*.py'
      - 'tests/**'
      - 'app.py'
      - '.github/workflows/postgres-staging-tests.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r migration/requirements.txt
      - run: python -m compileall -q app.py postgres_backend.py postgres_inventory_repairs.py postgres_staging_routes.py postgres_dashboard.py postgres_employee_security.py product_database.py tests
      - run: python -m unittest discover -s tests -p 'test_pg_staging_routes.py' -v
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: testuser
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: inventory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U testuser -d inventory_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CCM_TEST_DATABASE_URL: postgresql://testuser:testpassword@localhost:5432/inventory_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r migration/requirements.txt
      - run: python -m unittest discover -s tests -p 'test_real_postgres.py' -v
