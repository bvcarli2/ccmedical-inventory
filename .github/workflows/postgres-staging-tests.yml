name: PostgreSQL staging checks
on:
  push:
    branches: [chore/render-preparation]
  pull_request:
    paths:
      - 'postgres_*.py'
      - 'tests/**'
      - 'app.py'
      - '.github/workflows/postgres-staging-tests.yml'
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt -r migration/requirements.txt
      - run: python -m compileall -q app.py postgres_backend.py postgres_inventory_repairs.py postgres_staging_routes.py tests
      - run: python -m unittest discover -s tests -p 'test_pg_staging_routes.py' -v
